# Development environment values
global:
  environment: dev
  imageRegistry: ""

# PostgreSQL - lightweight for dev
postgresql:
  replicaCount: 1
  persistence:
    size: 5Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Redis - single node for dev
redis:
  replicaCount: 1
  cluster:
    enabled: false
  persistence:
    size: 2Gi
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# Evaluation API - single replica for dev
evaluationApi:
  replicaCount: 1
  image:
    tag: "dev"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env:
    ASPNETCORE_ENVIRONMENT: Development
  ingress:
    hosts:
      - host: evaluation-api.dev.local
        paths:
          - path: /
            pathType: Prefix

# Admin API - single replica for dev
adminApi:
  replicaCount: 1
  image:
    tag: "dev"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env:
    ASPNETCORE_ENVIRONMENT: Development
  ingress:
    hosts:
      - host: admin-api.dev.local
        paths:
          - path: /
            pathType: Prefix

# Development secrets (should be overridden in production)
secrets:
  postgresql:
    password: "dev-postgres-pass"
  evaluationApi:
    apiKey: "dev-eval-api-key"
  adminApi:
    apiKey: "dev-admin-api-key"
