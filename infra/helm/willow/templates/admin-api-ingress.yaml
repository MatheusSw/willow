{{- if and .Values.adminApi.enabled .Values.adminApi.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: willow-admin-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "willow.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-api
  {{- with .Values.adminApi.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.adminApi.ingress.className }}
  ingressClassName: {{ .Values.adminApi.ingress.className }}
  {{- end }}
  {{- if .Values.adminApi.ingress.tls }}
  tls:
    {{- range .Values.adminApi.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.adminApi.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: willow-admin-api
                port:
                  number: {{ $.Values.adminApi.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
